<link rel="canonical" href="https://snqv.dev">
<script>
  const targetLanding = "https://snqv.dev";
  const excludePrefix = "/forblog";
  // Normalize path: remove trailing slashes for consistent matching
  const currentPath = window.location.pathname.replace(/\/+$/, "");

  // Only redirect if path does NOT start with the excluded prefix
  if (!currentPath.startsWith(excludePrefix)) {
    window.location.href = targetLanding;
  }
</script>
<noscript>
  <p>Site moved. If you are not redirected automatically, <a href="https://snqv.dev">click here</a>.</p>
</noscript>
